[package]
name = "i2r-numeric"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "Shared mathematical integer interface for paired Isabelle2Rust experiments"

[features]
default = ["arbitrary"]
arbitrary = ["dep:dashu-int"]
checked = []

[dependencies]
dashu-int = { version = "=0.6.2", optional = true, default-features = false, features = ["std"] }
