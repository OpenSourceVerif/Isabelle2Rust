[package]
name = "isabelle2rust-optimize"
version = "0.1.0"
edition = "2021"

[lib]
name = "isabelle2rust_optimize"
path = "src/lib.rs"

[[bin]]
name = "cargo-opt"
path = "src/bin/cargo-opt.rs"

[dependencies]
syn = { version = "2", features = ["full"] }
rustlightast = { git = "https://github.com/OpenSourceVerif/RustLightAST.git", rev = "3543faca875d2856cc11d6d85f6fd54fd94f3ac1" }
# Local integration until the shared parser is available at a published Git revision.
# Keep the artifact's sibling AST checkout at its fixed revision.
rustlight-parser = { path = "../../../Rocq2Rust-workspace/RustLightAST/parser" }
