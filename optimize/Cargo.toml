[package]
name = "isabelle2rust-optimize"
version = "0.1.0"
edition = "2021"

[lib]
name = "isabelle2rust_optimize"
path = "src/lib.rs"

[[bin]]
name = "cargo-opt"
path = "src/bin/cargo-opt.rs"

[dependencies]
syn = { version = "2", features = ["full"] }
rustlightast = { path = "../../RustLightAST" }
